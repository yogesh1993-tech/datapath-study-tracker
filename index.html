<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Strict CSP: only local scripts/styles, no network access at all, no inline script. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; connect-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>DataPath - Study & Career Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232a78d6'/%3E%3Cpath d='M22 70 40 48l14 12 24-30' fill='none' stroke='white' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Main navigation"></aside>
  <div class="scrim" id="scrim" data-action="close-menu"></div>
  <div class="main-wrap">
    <header class="topbar">
      <button class="icon-btn menu-btn" data-action="open-menu" aria-label="Open menu">☰</button>
      <div class="search" id="searchBox">
        <span class="search-ico" aria-hidden="true">🔍</span>
        <input id="gsearch" type="search" placeholder="Search topics & subtopics   ( / )" autocomplete="off" maxlength="80" aria-label="Search topics">
        <div class="search-results" id="sresults" hidden></div>
      </div>
      <a class="timer-pill" id="timerPill" href="#/log" hidden aria-live="off"></a>
      <button class="btn small" data-action="quick-log" title="Log study time">＋ Log time</button>
      <button class="icon-btn" data-action="toggle-theme" id="themeBtn" aria-label="Toggle dark mode" title="Toggle dark / light">🌙</button>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="tooltip" id="tip" role="tooltip" hidden></div>
<dialog id="modal" aria-modal="true"></dialog>
<noscript><p style="padding:2rem;font-family:sans-serif">This app needs JavaScript enabled. All data stays in your browser.</p></noscript>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
